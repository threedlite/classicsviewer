plugins {
    id 'com.android.asset-pack'
}

// Part 1 of the extended delta (ANDROID_EXTENDED_LANGUAGE_PACKS_PROPOSAL.md).
// Contents: db_extended_part1_pack.db.zip + db_extended_part1_pack.manifest.json,
// both written by data-prep/assemble_database.py full. Never edited by hand.
assetPack {
    packName = "db_extended_part1_pack"
    dynamicDelivery {
        deliveryType = "on-demand"
    }
}
