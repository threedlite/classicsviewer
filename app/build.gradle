plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.classicsviewer.app'
    compileSdk 36

    // On-demand asset pack for full database download
    // The AAB will be ~1.4GB total, but Google Play handles this:
    // - Base APK (~170MB) downloads on install
    // - Asset pack (~1.3GB) downloads only when user requests it
    assetPacks = [":full_database_pack", ":audio_pack", ":references_pack", ":topical_pack"]

    // Load keystore properties if available
    def keystorePropertiesFile = file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.classicsviewer.app"
        minSdk 23  // Increased from 21 to support Age Signals API
        targetSdk 36
        versionCode 134
        versionName "0.8.134"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Add build timestamp
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\""
        
        // Only include English and Greek languages
        resourceConfigurations += ["en", "el"]
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "USE_MOCK_DATA", "false"
            applicationIdSuffix ".debug"
        }
        release {
            buildConfigField "boolean", "USE_MOCK_DATA", "false"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    
    // Include database files in APK
    packagingOptions {
        // Database files are now included directly
    }
    
    // Don't compress database files
    aaptOptions {
        noCompress 'db', 'zip'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    
    // RecyclerView for lists
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Flexbox layout for wrapping views
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // Room database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // XML parsing
    implementation 'com.fasterxml.woodstox:woodstox-core:6.5.1'
    
    // Media3 ExoPlayer for audio playback
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-ui:1.9.0'
    
    // Play Asset Delivery (for on-demand full database download)
    implementation 'com.google.android.play:asset-delivery:2.3.0'
    implementation 'com.google.android.play:asset-delivery-ktx:2.3.0'
    
    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // OpenCSV for CSV parsing
    implementation 'com.opencsv:opencsv:5.8'

    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // Play Age Signals API for age verification
    implementation 'com.google.android.play:age-signals:0.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Task to ensure database exists in debug assets before building
task checkDatabaseExists {
    doLast {
        def dbFile = file("$projectDir/src/debug/assets/perseus_texts.db.zip")
        if (!dbFile.exists()) {
            throw new GradleException("""
                ERROR: Database file not found at: ${dbFile.absolutePath}
                
                The database must be built before compiling the app.
                Please run one of the deployment scripts first:
                  - ./deploy_complete.sh (builds sample database)
                  - ./deploy_full_database.sh (builds full database)
                
                Or manually create the database:
                  1. cd data-prep
                  2. python3 create_perseus_database.py sample
                  3. zip -9 ../app/src/debug/assets/perseus_texts.db.zip perseus_texts_sample.db
            """)
        }
        println "✓ Database found at: ${dbFile.absolutePath} (${dbFile.length() / 1024 / 1024}MB)"
    }
}

// Task to complain (loudly) if Topical Links assets are missing. The source of
// truth for release builds is the topical_pack asset-pack module; debug builds
// also need them under src/debug/assets/topical/ since asset packs are AAB-only.
// Topical links are an optional, large add-on (the UI hides itself when absent),
// so this warns rather than failing the build like the required main database does.
task checkTopicalAssets {
    doLast {
        def names = ['topical_greek.db.zip', 'topical_latin.db.zip']
        def packDir = file("$rootDir/topical_pack/src/main/assets")
        def debugDir = file("$projectDir/src/debug/assets/topical")
        def missingInPack  = names.findAll { !new File(packDir, it).exists() }
        def missingInDebug = names.findAll { !new File(debugDir, it).exists() }
        if (missingInPack.isEmpty() && missingInDebug.isEmpty()) {
            names.each {
                def f = new File(packDir, it)
                println "✓ Topical asset found in topical_pack: $it (${f.length() / 1024 / 1024}MB)"
            }
        } else {
            println ""
            if (!missingInPack.isEmpty()) {
                println "⚠️  WARNING: Topical assets missing from topical_pack/src/main/assets/: ${missingInPack.join(', ')}"
            }
            if (!missingInDebug.isEmpty()) {
                println "⚠️  WARNING: Topical assets missing from src/debug/assets/topical/: ${missingInDebug.join(', ')}"
            }
            println "    The Topical Links button stays hidden until these are present."
            println "    Build them with:  python3 topical/build_topical_links.py greek   (then latin)"
            println "    The build script copies the zips into both locations automatically."
            println ""
        }
    }
}

// Task to copy font file to assets/fonts directory with correct name
task copyFontToAssets {
    doLast {
        def fontSource = file("$rootDir/font/sinaiticus_enhanced.ttf")
        def fontDestDebug = file("$projectDir/src/debug/assets/fonts/sinaiticus.ttf")
        def fontDestMain = file("$projectDir/src/main/assets/fonts/sinaiticus.ttf")

        if (fontSource.exists()) {
            // Create fonts directories if they don't exist
            fontDestDebug.parentFile.mkdirs()
            fontDestMain.parentFile.mkdirs()

            // Copy to both debug and main assets/fonts with renamed filename
            copy {
                from fontSource
                into fontDestDebug.parentFile
                rename { 'sinaiticus.ttf' }
            }
            copy {
                from fontSource
                into fontDestMain.parentFile
                rename { 'sinaiticus.ttf' }
            }
            println "✓ Font copied to assets/fonts/sinaiticus.ttf"
        } else {
            throw new GradleException("ERROR: Font file not found at: ${fontSource.absolutePath}")
        }
    }
}

// Task to copy audio file to assets
task copyAudioToAssets {
    doLast {
        def audioSource = file("$rootDir/audio/homer_iliad_chamberlain_audio_7.zip")
        def audioDestDebug = file("$projectDir/src/debug/assets/homer_iliad_chamberlain_audio_7.zip")
        def audioDestMain = file("$projectDir/src/main/assets/homer_iliad_chamberlain_audio_7.zip")

        if (audioSource.exists()) {
            // Create assets directories if they don't exist
            audioDestDebug.parentFile.mkdirs()
            audioDestMain.parentFile.mkdirs()

            // Copy to both debug and main assets
            copy {
                from audioSource
                into audioDestDebug.parentFile
            }
            copy {
                from audioSource
                into audioDestMain.parentFile
            }
            println "✓ Audio copied to assets: homer_iliad_chamberlain_audio_7.zip (${audioSource.length() / 1024 / 1024}MB)"
        } else {
            println "⚠️ Warning: Audio file not found at: ${audioSource.absolutePath}. Audio features will require manual import."
        }
    }
}

// Task to ensure audio exists in assets
task checkAudioExists {
    doLast {
        def audioFileDebug = file("$projectDir/src/debug/assets/homer_iliad_chamberlain_audio_7.zip")
        def audioFileMain = file("$projectDir/src/main/assets/homer_iliad_chamberlain_audio_7.zip")

        if (audioFileDebug.exists()) {
            println "✓ Audio found in debug assets: ${audioFileDebug.absolutePath} (${audioFileDebug.length() / 1024}KB)"
        }
        if (audioFileMain.exists()) {
            println "✓ Audio found in main assets: ${audioFileMain.absolutePath} (${audioFileMain.length() / 1024}KB)"
        }
        if (!audioFileDebug.exists() && !audioFileMain.exists()) {
            println "⚠️ Warning: No bundled audio found. Audio features will require manual import."
        }
    }
}

// Task to copy reference PDFs + manifest into the references_pack asset pack
// (and into app/src/debug/assets/references/ so debug APK builds can read them
// directly, since asset packs are AAB-only).
task copyReferencesToAssets {
    doLast {
        def referencesDir = file("$rootDir/references")
        def packAssets = file("$rootDir/references_pack/src/main/assets")
        def debugAssets = file("$projectDir/src/debug/assets/references")
        def manifest = file("$packAssets/references_manifest.json")

        if (!referencesDir.exists()) {
            throw new GradleException("ERROR: $referencesDir does not exist")
        }

        packAssets.mkdirs()
        debugAssets.mkdirs()

        def pdfs = fileTree(referencesDir) { include '*.pdf' }.files
        if (pdfs.isEmpty()) {
            throw new GradleException("ERROR: no PDFs found in $referencesDir")
        }

        pdfs.each { pdf ->
            copy { from pdf; into packAssets }
            copy { from pdf; into debugAssets }
        }

        // Regenerate the manifest via the bundled Python script.
        def venvPython = file("$rootDir/venv/bin/python3")
        def python = venvPython.exists() ? venvPython.absolutePath : 'python3'
        exec {
            workingDir rootDir
            commandLine python, "$rootDir/references_pack/build_manifest.py"
        }

        // Copy the freshly-generated manifest into debug assets too.
        if (manifest.exists()) {
            copy { from manifest; into debugAssets }
        } else {
            throw new GradleException("ERROR: build_manifest.py did not produce $manifest")
        }

        println "✓ References pack populated: ${pdfs.size()} PDF(s) + manifest"
    }
}

// Abort the build if a Python data-prep build is running. Gradle reads the
// debug DB zip from src/debug/assets/ which assemble_database.py writes; a
// concurrent assembly could either be read mid-write (corrupting the APK) or
// have its atomic rename collide with gradle's open file handle. The
// shared/build_lock.py mutex covers Python builds only; this task closes the
// gap for gradle. See BUILD.md §"Concurrent-build mutex" and
// "NEVER run builds in parallel".
task checkNoConcurrentDataBuild {
    doLast {
        def pattern = 'assemble_database\\.py|run_build\\.sh|create_.*_database\\.py'
        def proc = ['bash', '-c', "ps -Ao pid=,command= | grep -E '${pattern}' | grep -v grep || true"].execute()
        proc.waitFor()
        def out = proc.in.text.trim()
        if (!out.isEmpty()) {
            throw new GradleException("""
                ERROR: A data-prep build is currently running. Refusing to build the APK
                because gradle and assemble_database.py share src/debug/assets/perseus_texts.db.zip
                and a concurrent build can corrupt the APK or fail with an atomic-rename collision.

                Running process(es):
                ${out}

                Wait for the running build to finish (check its log), then re-run gradle.
                See BUILD.md §"Concurrent-build mutex" and "NEVER run builds in parallel".
            """.stripIndent())
        }
    }
}

// Make sure database and audio checks run before building
// Also copy font, audio, and reference files before build
preBuild.dependsOn checkNoConcurrentDataBuild
preBuild.dependsOn checkDatabaseExists
preBuild.dependsOn copyFontToAssets
preBuild.dependsOn copyAudioToAssets
preBuild.dependsOn checkAudioExists
preBuild.dependsOn copyReferencesToAssets
preBuild.dependsOn checkTopicalAssets

// Task to check AAB size after building
task checkAabSize {
    doLast {
        def aabFile = file("$buildDir/outputs/bundle/release/app-release.aab")
        if (aabFile.exists()) {
            def totalSizeInMB = aabFile.length() / 1024 / 1024
            println "Total AAB size: ${String.format('%.1f', totalSizeInMB)}MB"

            // Calculate base module size by reading ZIP entries
            def baseModuleSize = 0L
            def assetPackSizes = [:]

            new java.util.zip.ZipFile(aabFile).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.name.startsWith("base/")) {
                        baseModuleSize += entry.compressedSize
                    } else {
                        // Track asset pack sizes
                        def packName = entry.name.split("/")[0]
                        if (!packName.equals("BundleConfig.pb") && !packName.equals("BUNDLE-METADATA")) {
                            assetPackSizes[packName] = (assetPackSizes[packName] ?: 0L) + entry.compressedSize
                        }
                    }
                }
            }

            def baseModuleMB = baseModuleSize / 1024 / 1024
            println "Base module size: ${String.format('%.1f', baseModuleMB)}MB"

            // Check if on-demand asset packs are configured
            def hasAssetPacks = !android.assetPacks.isEmpty()

            if (hasAssetPacks) {
                assetPackSizes.each { packName, size ->
                    if (packName != "base") {
                        def sizeMB = size / 1024 / 1024
                        println "Asset pack '${packName}': ${String.format('%.1f', sizeMB)}MB"
                    }
                }
            }

            // Always check base module is under 200MB
            if (baseModuleMB > 200) {
                throw new GradleException("""
                    ERROR: Base module exceeds Google Play's 200MB limit!

                    Base module size: ${String.format('%.1f', baseModuleMB)}MB
                    Maximum allowed: 200MB

                    The database is too large for the base module.
                    Consider:
                    1. Reducing the number of authors in SAMPLE_AUTHORS.md
                    2. Using Play Asset Delivery for large assets
                """)
            } else {
                println "✓ Base module is within Google Play limits (${String.format('%.1f', baseModuleMB)}MB < 200MB)"
            }

            if (hasAssetPacks) {
                println "✓ AAB structure is valid for Play Asset Delivery"
            }

            // Check total AAB size is under 4GB (Google Play limit)
            def aabSizeGB = aabFile.length() / 1024 / 1024 / 1024
            if (aabSizeGB > 4) {
                throw new GradleException("""
                    ERROR: AAB exceeds Google Play's 4GB limit!

                    AAB size: ${String.format('%.2f', aabSizeGB)}GB
                    Maximum allowed: 4GB

                    Consider reducing asset pack sizes.
                """)
            } else {
                println "✓ AAB size is within Google Play limits (${String.format('%.2f', aabSizeGB)}GB < 4GB)"
            }
        }
    }
}

// Run size check after bundle task
afterEvaluate {
    tasks.bundleRelease.finalizedBy checkAabSize
}
