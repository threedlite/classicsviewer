name: ClassicsViewer
options:
  bundleIdPrefix: com.classicsviewer
  deploymentTarget:
    iOS: 26.0
  createIntermediateGroups: true
  
packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: 0.14.1
  SwiftCSV:
    url: https://github.com/swiftcsv/SwiftCSV.git
    from: 0.8.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0

targets:
  ClassicsViewer:
    type: application
    platform: iOS
    deploymentTarget: 26.0
    sources:
      - path: ClassicsViewer
        excludes:
          - Package.swift
          - Tests
          - .build
          - "**/.git"
          - "**/.build"
    resources:
      # Main bundled resources (excluding OnDemand)
      - path: ClassicsViewer/Resources
        excludes:
          - "OnDemand/**"
      - ClassicsViewer/LaunchScreen.storyboard
      # On-Demand Resources - each file with its tag
      - path: ClassicsViewer/Resources/OnDemand/homer_iliad_chamberlain_audio.zip
        resourceTags: [audio_full]
        buildPhase: resources
      - path: ClassicsViewer/Resources/OnDemand/perseus_texts_full.db.zip
        resourceTags: [database_full]
        buildPhase: resources
      - path: ClassicsViewer/Resources/OnDemand/perseus_texts_extended.db.zip
        resourceTags: [database_extended]
        buildPhase: resources
    # Resource tag configuration - tags in neither list are "download on demand"
    attributes:
      OnDemandResourcesInitialInstallTags: []
      OnDemandResourcesPrefetchOrder: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.classicsviewer.app
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: ClassicsViewer/Info.plist
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1,2
        ENABLE_BITCODE: NO
        # On-Demand Resources configuration
        ENABLE_ON_DEMAND_RESOURCES: YES
        EMBED_ASSET_PACKS_IN_PRODUCT_BUNDLE: NO
    dependencies:
      - package: SQLite
        product: SQLite
      - package: SwiftCSV
        product: SwiftCSV
      - package: ZIPFoundation
        product: ZIPFoundation
    preBuildScripts:
      - name: "Copy Database and Audio Files"
        script: |
          # Copy database from data-prep if needed
          DATABASE_SOURCE="${SRCROOT}/../data-prep/perseus_texts_sample.db.zip"
          DATABASE_DEST="${SRCROOT}/ClassicsViewer/Resources/perseus_texts.db.zip"

          if [ ! -f "$DATABASE_DEST" ]; then
            if [ -f "$DATABASE_SOURCE" ]; then
              echo "Copying database from data-prep..."
              mkdir -p "${SRCROOT}/ClassicsViewer/Resources"
              cp "$DATABASE_SOURCE" "$DATABASE_DEST"
              echo "Database copied successfully"
            else
              echo "error: Database source not found at: $DATABASE_SOURCE"
              echo "error: Please build the sample database first:"
              echo "error: cd ../data-prep && python3 create_perseus_database.py sample"
              exit 1
            fi
          fi

          # Copy audio file if needed
          AUDIO_SOURCE="${SRCROOT}/../audio/homer_iliad_chamberlain_audio_7.zip"
          AUDIO_DEST="${SRCROOT}/ClassicsViewer/Resources/homer_iliad_chamberlain_audio_7.zip"

          if [ ! -f "$AUDIO_DEST" ]; then
            if [ -f "$AUDIO_SOURCE" ]; then
              echo "Copying audio file from audio directory..."
              cp "$AUDIO_SOURCE" "$AUDIO_DEST"
              echo "Audio file copied successfully"
            fi
          fi